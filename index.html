<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABNB Calculator</title>
    <script>
        // Function to initialize the application
        function init() {
            // Load platform selection from localStorage
            const selectedPlatform = localStorage.getItem('selectedPlatform');
            if (selectedPlatform) {
                document.querySelector('input[name="platform"][value="' + selectedPlatform + '"]').checked = true;
            }

            // Disable past dates
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('checkout').setAttribute('min', today);
        }

        // Function to validate dates
        function validateDates() {
            const checkin = new Date(document.getElementById('checkin').value);
            const checkout = new Date(document.getElementById('checkout').value);
            return checkout > checkin;
        }

        // Function to handle form submission
        function handleSubmit(event) {
            event.preventDefault(); // Prevent default form submission

            // Validate dates
            if (!validateDates()) {
                alert('Checkout date must be after check-in date.');
                return;
            }

            // Additional validations for input bounds
            const rate = parseFloat(document.getElementById('rate').value);
            if (rate > 999999) {
                alert('Rate must not exceed $999,999.');
                return;
            }

            const taxRate = parseFloat(document.getElementById('tax-rate').value);
            if (taxRate > 25) {
                alert('Tax rate must not exceed 25%.');
                return;
            }

            const ccFee = parseFloat(document.getElementById('cc-fee').value);
            if (ccFee > 10) {
                alert('Credit card fee must not exceed 10%.');
                return;
            }

            // Process form data here...
            alert('Form submitted successfully!');
        }

        // Function to reset all inputs
        function resetForm() {
            document.getElementById('calculator-form').reset();
            localStorage.removeItem('selectedPlatform'); // Clear localStorage
            init(); // Re-initialize form
        }

        // Function to save selected platform to localStorage
        function savePlatform(platform) {
            localStorage.setItem('selectedPlatform', platform);
        }
    </script>
</head>
<body onload="init()">
    <header>
        <h1>ABNB Fee Calculator</h1>
        <button onclick="resetForm()">Reset</button>
    </header>
    <form id="calculator-form" onsubmit="handleSubmit(event)">
        <div>
            <label for="checkin">Check-in Date:</label>
            <input type="date" id="checkin" required>
            <label for="checkout">Check-out Date:</label>
            <input type="date" id="checkout" required>
        </div>
        <div>
            <label for="rate">Rate:</label>
            <input type="number" id="rate" min="0" placeholder="Enter rate"> 
            <label for="tax-rate">Tax Rate (%):</label>
            <input type="number" id="tax-rate" min="0" max="25" placeholder="Enter tax rate">
        </div>
        <div>
            <label for="cc-fee">Credit Card Fee (%):</label>
            <input type="number" id="cc-fee" min="0" max="10" placeholder="Enter CC fee">
        </div>
        <div>
            <input type="radio" name="platform" value="airbnb" onchange="savePlatform('airbnb')"> Airbnb
            <input type="radio" name="platform" value="vrbo" onchange="savePlatform('vrbo')"> VRBO
            <input type="radio" name="platform" value="direct" onchange="savePlatform('direct')"> Direct
        </div>
        <button type="submit">Calculate</button>
    </form>
    <footer>
        <p>Results will be displayed here...</p>
    </footer>
</body>
</html>
